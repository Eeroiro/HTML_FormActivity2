<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Siwagon - HTML Form Activity</title>
</head>

<body>

    <h1>HTML Form</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </p>

        </fieldset>

        <fieldset>
            <legend>Gender</legend>

            <p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <br>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <br>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </p>

        </fieldset>

        <fieldset>
            <legend>Hobbies</legend>

            <p>
                <input type="checkbox" id="Playing Games" name="hobby" value="Playing Games">
                <label for="Playing Games">Playing Games</label>

                <br>

                <input type="checkbox" id="cooking" name="hobby" value="cooking">
                <label for="cooking">cooking</label>

                <br>

                <input type="checkbox" id="Running" name="hobby" value="Running">
                <label for="Running">Running</label>
            </p>

        </fieldset>

        <p>
            <label for="comments">Additional Comments:</label>
            <br>
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
        </p>

        <p>
            <input type="submit" value="Submit">
        </p>

    </form>

</body>

</html>
